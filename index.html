<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Samantha Cripps for the WEB-115 course at Wake Tech!</p>
    <link rel="stylesheet" href="style.css">
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")
    </script>
    <noscript>
        <p>Unfortunately, this dashboard requires JavaScript to be enabled.</p>
    </noscript>
<div class="container">
    <div class="row">

    <div class="col" id="magic-eight-ball">
  <script src="js/magic-eight-ball.js" defer></script>
  <link rel="stylesheet" href="css/magic-eight-ball.css">

  <h2 class="heading">Magic Eight Ball</h2>
  <form>
    <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
    <input id="question" name="question" size="80">

    <div id="magicEightBall">
      <div id="circle"></div>
      <img id="ball" src="img/magic-eight-ball.png" />
    </div>

    <button id="reset" name="reset" type="reset">Ask another question</button>
  </form>
  <br>
</div>


      <div class="col" id="weekly-tasks">
       
     <div class="col" id="metric-converter">
    <h2>Imperial/Metric Converter</h2>

    <form id="converterForm">
        <label for="valueInput">Enter a value:</label>
        <input type="text" id="valueInput">

        <label for="conversionInput">Select conversion:</label>
        <select id="conversionInput">
            <option value="inch to centimeter">inch to centimeter</option>
            <option value="foot to centimeter">foot to centimeter</option>
            <option value="yard to meter">yard to meter</option>
            <option value="mile to kilometer">mile to kilometer</option>
            <option value="centimeter to inch">centimeter to inch</option>
            <option value="centimeter to foot">centimeter to foot</option>
            <option value="meter to yard">meter to yard</option>
            <option value="kilometer to mile">kilometer to mile</option>
        </select>

        <button id="convertBtn">Convert</button>
    </form>

    <p id="outputArea"></p>

    <script src="js/metric-converter.js" defer></script>
</div>
        <script src="js/task-manager.js"></script>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="daily-target">Daily Task Goal:</label>
            <input type="number" id="daily-target" placeholder="Tasks per day">

            <label for="bonus-tasks">Weekly Bonus Tasks:</label>
            <input type="number" id="bonus-tasks" placeholder="Bonus Tasks"> 

            <button id="goal-btn" type="button">Set Goals</button>
            
        </form>
        <p id="goal-message"></p>
      </div>  <!-- Dashboard Content -->
    </div>
</div>
</body>
</html>
